[workspace]
members = ["crates/acui-rows", "crates/acui-source", "crates/acui-model", "crates/acui-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
acui-rows = { path = "crates/acui-rows" }
acui-source = { path = "crates/acui-source" }
acui-model = { path = "crates/acui-model" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.17.1"
slint-build = "1.17.1"
