[workspace]
members = [
    "crates/acui-rows",
    "crates/acui-source",
    "crates/acui-model",
    "crates/acui-app",
    "crates/acui-setup",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
acui-rows = { path = "crates/acui-rows" }
acui-source = { path = "crates/acui-source" }
acui-model = { path = "crates/acui-model" }
anyhow = "1"
# Only the PNG decoder: the console decodes exactly two kinds of image, a
# verified capture frame and its own embedded application icon.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The formal ledger read face (offline) and the typed IPC client (online),
# pinned to Runtime main. One rev for every Runtime crate the console reads
# through.
actingcommand-contract = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "cd6bac2e864cd831aef3619a1f8757ef23bcaec2" }
actingcommand-ledger = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "cd6bac2e864cd831aef3619a1f8757ef23bcaec2" }
actingcommand-ledger-forensics = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "cd6bac2e864cd831aef3619a1f8757ef23bcaec2" }
actingcommand-runtime-client = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "cd6bac2e864cd831aef3619a1f8757ef23bcaec2" }
# Only what the console needs: the trim drops the renderers and backends this
# program never uses (software renderer, testing backend, Linux system tray).
# It does not drop image decoding, and the console does decode: the capture
# frames it reads through the material read face and verifies whole against
# their committed sha256, plus its own compile-time embedded application icon
# (Window.icon). Nothing else is ever fed to an Image element.
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "accessibility",
] }
slint-build = "1.17.1"
# The wizard's network paths: the umbrella Releases, and a resource package URL
# a person gives, over HTTPS. Blocking, rustls with the Mozilla root set
# compiled in; no system TLS library.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# The setup wizard only. sha2 re-hashes every release file against SHA256SUMS
# and the BUILD-MANIFEST.json inside each zip; it is the crate the Runtime's
# own artifact store already hashes with, so the lock gains nothing new.
sha2 = "0.10"
# zip reads the three release zips into staging. Deflate is the one method the
# umbrella's `zip -r -X` writes: no crypto, no bzip2, no zstd, no time. The 0.6
# line is what the Runtime's artifact store already locks.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# getrandom fills the 32-byte secret_fingerprint_salt and each new
# instance_id from the OS RNG; nothing else in the wizard needs randomness.
getrandom = "0.4"
# The wizard's shell work on Windows: where the Start menu, the desktop and the
# Startup folder are (SHGetKnownFolderPath, which follows a redirected or
# OneDrive desktop), and shortcuts written through the shell's own IShellLink.
# The same windows version Slint already locks, so the lock gains no crate.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
