[workspace]
members = ["crates/acui-rows", "crates/acui-source", "crates/acui-model", "crates/acui-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
acui-rows = { path = "crates/acui-rows" }
acui-source = { path = "crates/acui-source" }
acui-model = { path = "crates/acui-model" }
anyhow = "1"
# Only the PNG decoder: the console decodes exactly two kinds of image, a
# verified capture frame and its own embedded application icon.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The formal ledger read face (offline) and the typed IPC client (online),
# pinned to Runtime main. One rev for every Runtime crate the console reads
# through.
actingcommand-contract = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "c30c3c45aae8b06b96feca15c5ec9fbb744a70a7" }
actingcommand-ledger = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "c30c3c45aae8b06b96feca15c5ec9fbb744a70a7" }
actingcommand-ledger-forensics = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "c30c3c45aae8b06b96feca15c5ec9fbb744a70a7" }
actingcommand-runtime-client = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "c30c3c45aae8b06b96feca15c5ec9fbb744a70a7" }
# Only what the console needs: the trim drops the renderers and backends this
# program never uses (software renderer, testing backend, Linux system tray).
# It does not drop image decoding, and the console does decode: the capture
# frames it reads through the material read face and verifies whole against
# their committed sha256, plus its own compile-time embedded application icon
# (Window.icon). Nothing else is ever fed to an Image element.
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "accessibility",
] }
slint-build = "1.17.1"
