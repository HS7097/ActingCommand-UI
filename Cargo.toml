[workspace]
members = ["crates/acui-rows", "crates/acui-source", "crates/acui-model", "crates/acui-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
acui-rows = { path = "crates/acui-rows" }
acui-source = { path = "crates/acui-source" }
acui-model = { path = "crates/acui-model" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The formal ledger read face. temporary pin to PR398 head; bump to main after
# PR398 merges. One rev for every Runtime crate the console reads through.
actingcommand-contract = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "e41467b9f51d68ddf754f1b898ba4747963a9a1f" }
actingcommand-ledger = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "e41467b9f51d68ddf754f1b898ba4747963a9a1f" }
actingcommand-ledger-forensics = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "e41467b9f51d68ddf754f1b898ba4747963a9a1f" }
# Only what the console needs: the trim drops the renderers and backends this
# program never uses (software renderer, testing backend, Linux system tray).
# It does not drop image decoding: `image` stays a normal dependency of
# i-slint-core (`cargo tree -e normal -i image`). The only image this program
# decodes is its own compile-time embedded application icon (Window.icon);
# no ledger material is ever fed to an Image element.
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "accessibility",
] }
slint-build = "1.17.1"
