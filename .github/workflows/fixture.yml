name: fixture

# Workflow #429 E11: the console's offline acceptance material. Builds
# tools/fixture-state-root (its own package and Cargo.lock, outside the console
# workspace, pinned to the Runtime commit the offline read pins) and runs it
# once: the pinned Runtime host writes a small v0.12 state root on two fake
# devices and closes it. The whole root is zipped here, dot files included
# (upload-artifact leaves hidden files out of a directory upload), and the zip
# is uploaded as an Actions artifact named after the commit.
# Manual runs only. It builds no console, publishes no release and changes no
# other workflow.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Lease rounds the generator drives (roughly ten events each; 60 fill two to three offline pages of 256)
        required: false
        type: string
        default: '60'

permissions:
  contents: read

jobs:
  state-root:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4

      # As the Runtime's own CI: TEMP and TMP on the runner's temp directory.
      - name: Stable temp directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --manifest-path tools/fixture-state-root/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "fixture-state-root build failed with exit code $LASTEXITCODE" }

      - name: Write the state root
        id: root
        shell: pwsh
        env:
          ROUNDS: ${{ inputs.rounds || '60' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'fixture\state-root'
          cargo run --locked --manifest-path tools/fixture-state-root/Cargo.toml -- --out $root --rounds $env:ROUNDS
          if ($LASTEXITCODE -ne 0) { throw "fixture-state-root failed with exit code $LASTEXITCODE" }
          Get-ChildItem -LiteralPath $root -Recurse -Force -File | ForEach-Object {
            '{0,12} {1}' -f $_.Length, [IO.Path]::GetRelativePath($root, $_.FullName)
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "dir=$root"

      - name: Zip the state root
        id: zip
        shell: pwsh
        env:
          ROOT: ${{ steps.root.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $name = "fixture-state-root-$env:GITHUB_SHA"
          $zip = Join-Path (Split-Path -Parent $env:ROOT) "$name.zip"
          # The root's own contents at the zip root, every file and directory, hidden ones too.
          [IO.Compression.ZipFile]::CreateFromDirectory($env:ROOT, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
          $files = @(Get-ChildItem -LiteralPath $env:ROOT -Recurse -Force -File)
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | Where-Object { $_.Name -ne '' })
          } finally {
            $archive.Dispose()
          }
          if ($files.Count -eq 0 -or $entries.Count -ne $files.Count) {
            throw "fixture zip holds $($entries.Count) files, the state root $($files.Count)"
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "$name.zip: $((Get-Item -LiteralPath $zip).Length) bytes, $($entries.Count) files, sha256 $hash"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "zip=$zip"

      - name: Upload the state root
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
