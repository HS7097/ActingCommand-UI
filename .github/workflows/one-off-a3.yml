name: one-off-a3

# one-off (to be reverted): Workflow #288 A3 evidence. The RT tools and runtime are the
# Actions artifacts of RT run 36882662738 (1adc2d40, whose tree 2f9e1314 is RT main
# 3b15f86f's); the v1 bundle is the public umbrella's bundles/bluearchive-bundle-3ff697b.zip
# at 536f048a. crates/acui-setup/src/one_off_a3.rs builds the v2 bundle with actinglab and
# drives the installer's own lay-out over it.

on:
  push:
    branches: [claude/ui-repin-rt-3b15f86f]

permissions:
  contents: read
  actions: read

jobs:
  a3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download the RT artifacts and the umbrella v1 bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          a3="$RUNNER_TEMP/a3"
          mkdir -p "$a3/work"
          gh api repos/HS7097/ActingCommand-Runtime/actions/artifacts/11174785035/zip > "$a3/tools.zip"
          gh api repos/HS7097/ActingCommand-Runtime/actions/artifacts/11174065275/zip > "$a3/runtime.zip"
          curl -fsSL -o "$a3/bluearchive-bundle-3ff697b.zip" \
            https://raw.githubusercontent.com/HS7097/ActingCommand/536f048a3cac26ddbb0391895391f98967704cb0/bundles/bluearchive-bundle-3ff697b.zip
          sha256sum "$a3"/*.zip
      - name: Unpack the RT artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $a3 = Join-Path $env:RUNNER_TEMP 'a3'
          foreach ($name in 'tools', 'runtime') {
            Expand-Archive -LiteralPath (Join-Path $a3 "$name.zip") -DestinationPath (Join-Path $a3 $name)
            Get-ChildItem -LiteralPath (Join-Path $a3 $name) -Recurse -File | ForEach-Object { "$name $($_.Length) $($_.FullName)" }
            $manifest = Get-ChildItem -LiteralPath (Join-Path $a3 $name) -Recurse -Filter 'BUILD-MANIFEST.json' | Select-Object -First 1
            $parsed = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
            "$name BUILD-MANIFEST: repository $($parsed.repository) commit $($parsed.commit_sha) tree $($parsed.tree_sha) run $($parsed.workflow_run_id)"
            if ($parsed.commit_sha -cne '1adc2d40f4630b5cd3afb018a823b03067519838' -or $parsed.tree_sha -cne '2f9e131489751df796eba65ea55812d5ad862c49') {
              throw "$name artifact is not the build of 1adc2d40 / tree 2f9e1314"
            }
          }
          $lab = (Get-ChildItem -LiteralPath (Join-Path $a3 'tools') -Recurse -Filter 'actinglab.exe' | Select-Object -First 1).FullName
          $actingd = (Get-ChildItem -LiteralPath (Join-Path $a3 'runtime') -Recurse -Filter 'actingcommand-actingd.exe' | Select-Object -First 1).FullName
          if (-not $lab -or -not $actingd) { throw "actinglab.exe or actingcommand-actingd.exe missing" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONE_OFF_ACTINGLAB=$lab"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONE_OFF_ACTINGD=$actingd"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONE_OFF_WORK=$(Join-Path $a3 'work')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ONE_OFF_BUNDLE_V1=$(Join-Path $a3 'bluearchive-bundle-3ff697b.zip')"
      - name: Installer lay-out over bundle v2 and v1
        shell: pwsh
        run: cargo test --locked -p acui-setup --bins one_off_a3 -- --nocapture --test-threads=1
      - name: One-off log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/a3/work/one-off-a3.log"
