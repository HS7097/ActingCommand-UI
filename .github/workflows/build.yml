name: build

# A push to main builds nothing: a main commit is built for publication only when
# release.yml calls this workflow (workflow_call). Branch pushes and pull requests
# keep their builds (a branch push builds the exact branch head).
# No permissions block on purpose: branch and pull-request runs use the repository's
# default read-only token, and a release run inherits the calling job's
# contents: write, which a block here would downgrade.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character lowercase main commit to build and release
        required: true
        type: string
      release_tag:
        description: Release tag to create on source_sha (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
      previous_tag:
        description: Previous release tag the generated pull-request list starts from (empty for the first release)
        required: false
        type: string
        default: ''
      prerelease:
        description: Publish as a pre-release, never marked Latest (a tag with a '-' suffix always is one)
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build, verify and stage the release files without creating the tag or the release
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty outside a release run: the event's own commit, as before.
          ref: ${{ inputs.source_sha }}
      # Workflow #378 A-4: the UI's own outcome codes, locations and keys (setup_ and console_
      # names, crates/acui-installation/outcome-codes.json) and their words (outcome-text.json)
      # against the Runtime's merged catalog at the commit runtime-outcome-catalog.rev names. That
      # pin is apart from the Cargo dependency's rev; edit the file to move it. Both legs run it;
      # it is a verification step, not a test.
      - name: Check UI outcome codes against the Runtime catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revPath = 'crates/acui-installation/runtime-outcome-catalog.rev'
          $tablePath = 'crates/acui-installation/outcome-codes.json'
          $textPath = 'crates/acui-installation/outcome-text.json'
          $constPath = 'crates/acui-installation/src/outcome.rs'
          $schema = 'actingcommand.outcome-codes.v1'

          $revText = Get-Content -LiteralPath $revPath -Raw
          if ($null -eq $revText -or $revText -cnotmatch '\A[0-9a-f]{40}\r?\n?\z') {
            throw "outcome_catalog_rev_invalid: $revPath must hold one 40-character lowercase Runtime commit and nothing else, not '$revText'"
          }
          $rev = $revText.Substring(0, 40)
          $url = "https://raw.githubusercontent.com/HS7097/ActingCommand-Runtime/$rev/contracts/outcome-codes.json"
          $runtimeText = $null
          foreach ($attempt in 1, 2) {
            try {
              $runtimeText = (Invoke-WebRequest -Uri $url -TimeoutSec 120).Content
              if ($runtimeText -is [byte[]]) { $runtimeText = [Text.Encoding]::UTF8.GetString($runtimeText) }
              break
            } catch {
              if ($attempt -eq 2) {
                throw "outcome_catalog_unavailable: the Runtime catalog at $rev did not download in 2 attempts ($url): $($_.Exception.Message)"
              }
              Write-Host "Runtime catalog download attempt $attempt failed: $($_.Exception.Message); retrying in 10 s"
              Start-Sleep -Seconds 10
            }
          }
          try {
            $runtime = $runtimeText | ConvertFrom-Json -Depth 64
          } catch {
            throw "outcome_catalog_unreadable: the Runtime catalog at $rev is not JSON: $($_.Exception.Message)"
          }
          if ($runtime.schema_version -cne $schema) {
            throw "outcome_catalog_unreadable: the Runtime catalog at $rev has schema_version '$($runtime.schema_version)', not $schema"
          }
          foreach ($section in 'keys', 'domains', 'codes', 'locations') {
            if ($runtime.$section -isnot [Management.Automation.PSCustomObject]) {
              throw "outcome_catalog_unreadable: the Runtime catalog at $rev has no $section object"
            }
          }
          try {
            $ui = Get-Content -LiteralPath $tablePath -Raw | ConvertFrom-Json -Depth 64
            $text = Get-Content -LiteralPath $textPath -Raw | ConvertFrom-Json -Depth 64
          } catch {
            throw "outcome_catalog_unreadable: a UI outcome table is not JSON: $($_.Exception.Message)"
          }

          function Get-Members($object) {
            if ($object -is [Management.Automation.PSCustomObject]) {
              foreach ($property in $object.PSObject.Properties) { $property.Name }
            }
          }
          function New-NameSet($names) {
            $set = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($name in $names) { [void]$set.Add($name) }
            , $set
          }
          function Test-Words($value) { $value -is [string] -and $value.Trim().Length -gt 0 }
          function Test-UiOwned($owners) { $list = @($owners); $list.Count -eq 1 -and $list[0] -ceq 'ui' }

          $problems = [Collections.Generic.List[string]]::new()
          $namePattern = '\A(setup|console)_[a-z0-9]+(_[a-z0-9]+)+\z'
          $keyPattern = '\A(setup|console)_[a-z0-9]+(_[a-z0-9]+)*\z'
          $prefixPattern = '\A(setup|console)_'
          $categories = @('success', 'info', 'warning', 'error', 'fatal')
          $tongues = @('en', 'zh-Hans')
          $runtimeCodes = New-NameSet (Get-Members $runtime.codes)
          $runtimeLocations = New-NameSet (Get-Members $runtime.locations)
          $runtimeKeys = New-NameSet (Get-Members $runtime.keys)
          $runtimePrefixes = @(Get-Members $runtime.domains)

          if ($ui.schema_version -cne $schema) { $problems.Add("$tablePath`: schema_version is not $schema") }
          foreach ($section in 'domains', 'keys', 'codes', 'locations') {
            if ($ui.$section -isnot [Management.Automation.PSCustomObject]) { $problems.Add("$tablePath`: $section is not an object") }
          }
          $uiPrefixes = @(Get-Members $ui.domains)
          if (($uiPrefixes | Sort-Object) -join ',' -cne 'console_,setup_' -or
              @($uiPrefixes | Where-Object { -not (Test-UiOwned $ui.domains.$_) }).Count -ne 0) {
            $problems.Add("$tablePath`: domains must be exactly setup_ and console_, each owned by [""ui""]")
          }
          $uiCodes = New-NameSet (Get-Members $ui.codes)
          $uiLocations = New-NameSet (Get-Members $ui.locations)
          $uiKeys = New-NameSet (Get-Members $ui.keys)

          # UI keys: prefixed, typed, and none of the Runtime's.
          foreach ($key in $uiKeys) {
            $type = $ui.keys.$key.type
            if ($key -cnotmatch $keyPattern -or [Text.Encoding]::UTF8.GetByteCount($key) -gt 64) {
              $problems.Add("key $key`: a UI key is setup_ or console_ plus snake_case, at most 64 bytes")
            }
            if (-not (Test-Words $type) -or -not (Test-Words $ui.keys.$key.description)) {
              $problems.Add("key $key`: needs a type and a description")
            }
            if ($runtimeKeys.Contains($key)) {
              $runtimeType = $runtime.keys.$key.type
              $agreement = if ($runtimeType -ceq $type) { 'same type' } else { "key-type conflict: UI $type, Runtime $runtimeType" }
              $problems.Add("key $key`: also a Runtime key ($agreement)")
            }
          }

          # UI codes and locations: names, ownership by domain, entry shape.
          foreach ($kind in 'codes', 'locations') {
            $names = $uiCodes
            if ($kind -ceq 'locations') { $names = $uiLocations }
            $singular = $kind.TrimEnd('s')
            foreach ($name in $names) {
              $entry = $ui.$kind.$name
              if ($name -cnotmatch $namePattern -or [Text.Encoding]::UTF8.GetByteCount($name) -gt 64) {
                $problems.Add("$singular $name`: a UI name is setup_ or console_ plus at least two snake_case words, at most 64 bytes")
              }
              if ($runtimeCodes.Contains($name)) { $problems.Add("$singular $name`: also a Runtime code") }
              if ($runtimeLocations.Contains($name)) { $problems.Add("$singular $name`: also a Runtime location") }
              if ($kind -ceq 'codes' -and $uiLocations.Contains($name)) { $problems.Add("code $name`: also a UI location") }
              $longest = $runtimePrefixes | Where-Object { $name.StartsWith($_, [StringComparison]::Ordinal) } |
                Sort-Object -Property Length -Descending | Select-Object -First 1
              if (-not $longest) {
                $problems.Add("$singular $name`: no Runtime domain prefix covers it")
              } elseif (-not (Test-UiOwned $runtime.domains.$longest)) {
                $problems.Add("$singular $name`: its Runtime domain $longest belongs to [$(@($runtime.domains.$longest) -join ', ')], not [ui]")
              }
              if ($entry.owner -cne 'ui' -or $entry.layer -cne 'ui') { $problems.Add("$singular $name`: owner and layer must be ui") }
              if ($entry.review -cnotin 'pending', 'settled') { $problems.Add("$singular $name`: review is neither pending nor settled") }
              if ($entry.status -cnotin 'active', 'retired') { $problems.Add("$singular $name`: status is neither active nor retired") }
              if ($entry.since -isnot [string] -or $entry.since -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') { $problems.Add("$singular $name`: since is not a UI release X.Y.Z") }
              if (-not (Test-Words $entry.description)) { $problems.Add("$singular $name`: description is empty") }
              if ($kind -cne 'codes') { continue }
              if ($entry.category -cnotin $categories) { $problems.Add("code $name`: category is not one of $($categories -join ', ')") }
              if ($entry.uncertain -isnot [bool]) { $problems.Add("code $name`: uncertain is not true or false") }
              foreach ($field in 'common_causes', 'handling') {
                if (-not (Test-Words $entry.$field) -or ($entry.review -ceq 'settled' -and $entry.$field -ceq 'TBD')) {
                  $problems.Add("code $name`: $field is empty, or TBD on a settled code")
                }
              }
              if ($entry.values -isnot [Management.Automation.PSCustomObject]) {
                $problems.Add("code $name`: values is not an object")
                continue
              }
              foreach ($key in Get-Members $entry.values) {
                if ($entry.values.$key -cnotin 'required', 'optional') { $problems.Add("code $name`: value $key is neither required nor optional") }
                if ($key -cmatch $prefixPattern) {
                  if (-not $uiKeys.Contains($key)) { $problems.Add("code $name`: value $key is not a UI key") }
                } elseif (-not $runtimeKeys.Contains($key)) {
                  $problems.Add("code $name`: value $key is not a Runtime key")
                } elseif ($uiKeys.Contains($key) -and $ui.keys.$key.type -cne $runtime.keys.$key.type) {
                  $problems.Add("code $name`: value $key is typed $($ui.keys.$key.type) in the UI table and $($runtime.keys.$key.type) in the Runtime catalog")
                }
              }
            }
          }

          # The other direction: the Runtime registers no UI name and gives setup_/console_ to no one else.
          foreach ($pair in @{ code = $runtimeCodes; location = $runtimeLocations; key = $runtimeKeys }.GetEnumerator()) {
            foreach ($name in $pair.Value) {
              if ($name -cmatch $prefixPattern) { $problems.Add("Runtime $($pair.Key) $name`: setup_ and console_ names are the UI's") }
            }
          }
          foreach ($base in 'setup_', 'console_') {
            if ($runtimePrefixes -cnotcontains $base) { $problems.Add("Runtime domains: $base is missing") }
          }
          foreach ($prefix in $runtimePrefixes) {
            if ($prefix -cmatch $prefixPattern -and -not (Test-UiOwned $runtime.domains.$prefix)) {
              $problems.Add("Runtime domain $prefix`: belongs to [$(@($runtime.domains.$prefix) -join ', ')], not [ui]")
            }
          }

          # The words: every category's generic sentence, every UI code's own, and nothing else.
          foreach ($category in $categories) {
            foreach ($tongue in $tongues) {
              $words = $text.generic.$category.$tongue
              foreach ($field in 'sentence', 'short') {
                if (-not (Test-Words $words.$field)) { $problems.Add("$textPath`: generic.$category.$tongue.$field is missing or empty") }
              }
            }
          }
          foreach ($code in $uiCodes) {
            foreach ($tongue in $tongues) {
              $words = $text.codes.$code.$tongue
              foreach ($field in 'sentence', 'short', 'handling') {
                if (-not (Test-Words $words.$field)) { $problems.Add("$textPath`: codes.$code.$tongue.$field is missing or empty") }
              }
            }
          }
          foreach ($code in Get-Members $text.codes) {
            if (-not $uiCodes.Contains($code)) { $problems.Add("$textPath`: codes.$code is not a code of $tablePath") }
            $same = $text.codes.$code.same_as
            if ($null -ne $same -and -not ($same -is [string] -and $runtimeCodes.Contains($same))) {
              $problems.Add("$textPath`: codes.$code.same_as '$same' is not a Runtime code")
            }
          }

          # The Rust constants name exactly the UI codes.
          $constants = New-NameSet ([regex]::Matches((Get-Content -LiteralPath $constPath -Raw),
            'pub const [A-Z][A-Z0-9_]*: &str =\s*"((?:setup|console)_[a-z0-9_]+)";') | ForEach-Object { $_.Groups[1].Value })
          foreach ($constant in $constants) {
            if (-not $uiCodes.Contains($constant) -and -not $uiLocations.Contains($constant)) {
              $problems.Add("$constPath`: constant $constant is not in $tablePath")
            }
          }
          foreach ($code in $uiCodes) {
            if (-not $constants.Contains($code)) { $problems.Add("$constPath`: code $code has no constant") }
          }

          if ($problems.Count -ne 0) {
            throw "outcome_catalog_conflict: $($problems.Count) problem(s) against Runtime ${rev}:`n- $($problems -join "`n- ")"
          }
          Write-Host "$($uiCodes.Count) codes / $($uiLocations.Count) locations checked against Runtime $rev"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-icccm4-dev \
            libxcb-cursor-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --workspace

      # Windows only: stage the console and the stable entry with a build manifest in the
      # same shape as the Runtime's exact-SHA artifacts, so the umbrella can fetch
      # and verify them by commit SHA. Nothing below changes the build itself. acsetup is
      # out of the workspace from UI-0a until UI-2a (Workflow #429 v5 F), so it is not staged.
      - name: Stage Windows artifact with build manifest
        if: runner.os == 'Windows'
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -cnotmatch '^[0-9a-f]{40}$') { throw "cannot resolve HEAD: '$sha'" }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          $name = "acui-windows-$sha"
          $dir = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $payload = @('acui.exe', 'acforward.exe', 'LICENSE', 'README.md')
          Copy-Item -LiteralPath 'target\release\acui.exe' -Destination (Join-Path $dir 'acui.exe')
          Copy-Item -LiteralPath 'target\release\acforward.exe' -Destination (Join-Path $dir 'acforward.exe')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $dir 'LICENSE')
          Copy-Item -LiteralPath 'README.md' -Destination (Join-Path $dir 'README.md')
          $files = foreach ($f in $payload) {
            $p = Join-Path $dir $f
            $item = Get-Item -LiteralPath $p -ErrorAction Stop
            if ($item.Length -le 0) { throw "staged file is empty: $f" }
            [ordered]@{
              path = $f
              size_bytes = [int64]$item.Length
              sha256 = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $rustc = ((& rustc --version --verbose) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0) { throw "rustc version query failed with exit code $LASTEXITCODE" }
          # Workflow #364: this build's interface declaration, the file acsetup compiles in once it is back (UI-2a)
          # (Runtime contracts/component-interfaces.md). A file that is not a valid v1
          # declaration, or that disagrees with installation_selection_schema, stops the build.
          $interfaces = Get-Content -LiteralPath 'crates/acui-setup/component-interfaces.json' -Raw | ConvertFrom-Json -Depth 20
          if ($interfaces.schema_version -cne 'actingcommand.component-interfaces.v1') {
            throw "component-interfaces.json: schema_version is not actingcommand.component-interfaces.v1: $($interfaces.schema_version)"
          }
          # Not $name: that holds the artifact name, which the manifest and the outputs below use.
          foreach ($interface in @('actingd-config', 'install-selection', 'install-control', 'ledger', 'runtime-client', 'package', 'runtime-outcomes')) {
            $range = @($interfaces.speaks.$interface)
            if ($range.Count -ne 2 -or @($range | Where-Object { "$_" -cnotmatch '\A[0-9]+\z' }).Count -ne 0 -or
                [int64]"$($range[0])" -gt [int64]"$($range[1])") {
              throw "component-interfaces.json: speaks.$interface is not [min, max] with 0 <= min <= max"
            }
          }
          $selection = @($interfaces.speaks.'install-selection')
          if ([int64]"$($selection[0])" -gt 1 -or [int64]"$($selection[1])" -lt 1) {
            throw 'component-interfaces.json: install-selection must hold 1, as installation_selection_schema is actingcommand.install-selection.v1'
          }
          $manifest = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            commit_sha = $sha
            tree_sha = $tree
            cargo_lock_sha256 = (Get-FileHash -LiteralPath 'Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
            rust_toolchain = $rustc
            target = 'x86_64-pc-windows-msvc'
            configuration = 'release'
            installation_selection_schema = 'actingcommand.install-selection.v1'
            workflow_run_id = [uint64]$env:GITHUB_RUN_ID
            workflow_run_attempt = [uint32]$env:GITHUB_RUN_ATTEMPT
            source_artifact_name = $name
            files = @($files)
            interfaces = $interfaces
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $dir 'BUILD-MANIFEST.json'), "$json`n", [Text.UTF8Encoding]::new($false))
          $written = (Get-Content -LiteralPath (Join-Path $dir 'BUILD-MANIFEST.json') -Raw | ConvertFrom-Json -Depth 20).interfaces | ConvertTo-Json -Depth 20 -Compress
          if ($written -cne ($interfaces | ConvertTo-Json -Depth 20 -Compress)) {
            throw "BUILD-MANIFEST.json interfaces differ from component-interfaces.json: $written"
          }
          Write-Host "BUILD-MANIFEST.json interfaces: $written"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "dir=$dir"

      # Actions artifacts are acceptance builds only; a release run publishes the Release instead.
      - name: Upload Windows artifact
        if: runner.os == 'Windows' && !inputs.release_tag
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      # The ubuntu leg of a release run is a compile check only; the Windows leg publishes.
      - name: Publish the release
        if: runner.os == 'Windows' && inputs.release_tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.stage.outputs.name }}
          ARTIFACT_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          # Zips the staged directory (files at the zip root, as the Actions artifact),
          # reads the zip back against its BUILD-MANIFEST.json, writes SHA256SUMS and
          # creates the Release with its tag on the exact source commit.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?\z') {
            throw "release_input_invalid: release tag is not vX.Y.Z or vX.Y.Z-rc.N: $tag"
          }
          if ($env:PREVIOUS_TAG -and $env:PREVIOUS_TAG -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            throw "release_input_invalid: previous release tag is not vX.Y.Z: $env:PREVIOUS_TAG"
          }
          if ($env:DRY_RUN -cne 'true' -and $env:DRY_RUN -cne 'false') {
            throw "release_input_invalid: dry_run is neither true nor false: $env:DRY_RUN"
          }
          if ($env:PRERELEASE -cne 'true' -and $env:PRERELEASE -cne 'false') {
            throw "release_input_invalid: prerelease is neither true nor false: $env:PRERELEASE"
          }
          # A pre-release is never marked Latest (GitHub does not allow it); nothing passes --latest.
          $prerelease = $env:PRERELEASE -ceq 'true' -or $tag.Contains('-')
          if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $env:ARTIFACT_NAME -cne "acui-windows-$env:SOURCE_SHA") {
            throw "release_input_invalid: staged $env:ARTIFACT_NAME is not the build of source $env:SOURCE_SHA"
          }
          $dryRun = $env:DRY_RUN -ceq 'true'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'acui-release'
          $check = Join-Path $env:RUNNER_TEMP 'acui-release-readback'
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null

          $zip = Join-Path $releaseRoot "$env:ARTIFACT_NAME.zip"
          Compress-Archive -Path (Join-Path $env:ARTIFACT_DIR '*') -DestinationPath $zip -CompressionLevel Optimal
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          $manifest = Get-Content -LiteralPath (Join-Path $check 'BUILD-MANIFEST.json') -Raw | ConvertFrom-Json
          $tree = (& git rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "release_zip_unverified: git tree resolution failed with exit code $LASTEXITCODE"
          }
          if ($manifest.repository -cne $env:GITHUB_REPOSITORY -or $manifest.commit_sha -cne $env:SOURCE_SHA -or
              $manifest.tree_sha -cne $tree -or $manifest.source_artifact_name -cne $env:ARTIFACT_NAME) {
            throw "release_zip_unverified: BUILD-MANIFEST.json names $($manifest.source_artifact_name) from $($manifest.repository)@$($manifest.commit_sha)"
          }
          $expected = @(@($manifest.files | ForEach-Object { [string]$_.path }) + 'BUILD-MANIFEST.json' | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $check -Recurse -File -Force |
            ForEach-Object { [IO.Path]::GetRelativePath($check, $_.FullName) } | Sort-Object)
          if (($expected -join '|') -cne ($actual -join '|')) {
            throw "release_zip_unverified: $env:ARTIFACT_NAME.zip holds [$($actual -join ', ')], expected [$($expected -join ', ')]"
          }
          foreach ($file in $manifest.files) {
            $path = Join-Path $check ([string]$file.path)
            if ((Get-Item -LiteralPath $path).Length -ne [int64]$file.size_bytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$file.sha256) {
              throw "release_zip_unverified: $env:ARTIFACT_NAME.zip $($file.path) does not match BUILD-MANIFEST.json"
            }
          }
          Write-Host "release zip $env:ARTIFACT_NAME.zip: $((Get-Item -LiteralPath $zip).Length) bytes, BUILD-MANIFEST.json and $($expected.Count - 1) files read back"

          $sumsPath = Join-Path $releaseRoot 'SHA256SUMS'
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = "$zipHash  $env:ARTIFACT_NAME.zip"
          [IO.File]::WriteAllText($sumsPath, "$sums`n", [Text.UTF8Encoding]::new($false))

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = @(
            "Built from commit ``$env:SOURCE_SHA`` (tree ``$tree``) by [run $env:GITHUB_RUN_ID, attempt $env:GITHUB_RUN_ATTEMPT]($runUrl).",
            '',
            'Assets (SHA-256, as in `SHA256SUMS`):',
            "- ``$env:ARTIFACT_NAME.zip``: ``$zipHash``",
            '',
            'The version exists only in this tag; the executables and the BUILD-MANIFEST.json in the zip bind the commit above.'
          )
          if (-not $env:PREVIOUS_TAG) {
            $notes += ''
            $notes += 'First release: there is no earlier release to list pull requests from.'
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'acui-release-notes.md'
          [IO.File]::WriteAllText($notesPath, (($notes -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))

          $arguments = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:SOURCE_SHA, '--title', $tag, '--notes-file', $notesPath)
          if ($env:PREVIOUS_TAG) {
            $arguments += @('--generate-notes', '--notes-start-tag', $env:PREVIOUS_TAG)
          }
          if ($prerelease) {
            $arguments += '--prerelease'
          }
          $arguments += @($zip, $sumsPath)
          Get-ChildItem -LiteralPath $releaseRoot | ForEach-Object { Write-Host "staged $($_.Name) $($_.Length) bytes" }
          Write-Host "SHA256SUMS:`n$sums"
          Write-Host "release notes:`n$($notes -join "`n")"
          Write-Host "release command: gh $($arguments -join ' ')"
          if ($dryRun) {
            Write-Host "dry run: not published ($tag at $env:SOURCE_SHA, prerelease=$prerelease)"
          } else {
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "release_create_failed: gh release create exited $LASTEXITCODE"
            }
            $tagCommit = (& gh api "repos/$env:GITHUB_REPOSITORY/commits/tags/$tag" --jq .sha | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:SOURCE_SHA) {
              throw "release_readback_failed: tag $tag resolves to '$tagCommit', expected $env:SOURCE_SHA"
            }
            $published = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | Out-String | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $published.draft) {
              throw "release_readback_failed: release $tag is missing or still a draft"
            }
            if ([bool]$published.prerelease -ne $prerelease) {
              throw "release_readback_failed: release $tag prerelease=$($published.prerelease), expected $prerelease"
            }
            $expectedAssets = @(@($zip, $sumsPath) | ForEach-Object {
              "$([IO.Path]::GetFileName($_)) $((Get-Item -LiteralPath $_).Length)"
            } | Sort-Object)
            $actualAssets = @($published.assets | ForEach-Object { "$($_.name) $($_.size)" } | Sort-Object)
            if (($expectedAssets -join '|') -cne ($actualAssets -join '|')) {
              throw "release_readback_failed: release $tag assets [$($actualAssets -join ', ')], expected [$($expectedAssets -join ', ')]"
            }
            Write-Host "published $($published.html_url): tag $tag -> $tagCommit, prerelease=$($published.prerelease), assets $($actualAssets -join ', ')"
          }
