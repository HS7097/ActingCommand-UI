# The offline acceptance material maker (Workflow #429 E11): a small Runtime v0.12
# state root, written by the pinned Runtime host itself on fake devices. Its own
# package with its own Cargo.lock, kept out of the console workspace (root
# Cargo.toml `exclude`), so the console's build and its lock never see it; only
# .github/workflows/fixture.yml builds and runs it.
[package]
name = "fixture-state-root"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# One exact Runtime source for every Runtime crate, the one the console's
# offline read pins (UI-0a, Runtime PR #1469 head, #429 114-A). Without `fixture-backends`:
# the fake instances resolve as physical devices, as the observe and lease
# paths require.
[dependencies]
actingcommand-contract = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "7f654bfa598db7a1cab29f88b449bd4dbc7cb8e4" }
actingcommand-device = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "7f654bfa598db7a1cab29f88b449bd4dbc7cb8e4" }
actingcommand-ledger = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "7f654bfa598db7a1cab29f88b449bd4dbc7cb8e4" }
actingcommand-runtime-client = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "7f654bfa598db7a1cab29f88b449bd4dbc7cb8e4" }
actingcommand-runtime-host = { git = "https://github.com/HS7097/ActingCommand-Runtime.git", rev = "7f654bfa598db7a1cab29f88b449bd4dbc7cb8e4" }
