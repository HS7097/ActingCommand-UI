[package]
name = "acui-glass"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dependencies]
# On top of the workspace's Win32_Foundation and Win32_UI_Shell (SetWindowSubclass):
# hit testing, DWM attributes, the underlay window, Composition and its Direct2D
# interop. The same windows version Slint already locks, so the lock gains no crate.
windows = { workspace = true, features = [
    "Foundation",
    "Graphics_Effects",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] macro names windows_core directly.
windows-core = { workspace = true }
# Composition's Vector2 and Vector3.
windows-numerics = { workspace = true }
