[package]
name = "acui-wizard"
version.workspace = true
edition.workspace = true
license.workspace = true

# The 0.12 setup wizard (Workflow #429 UI-W2): a library the window (UI-W2b) and the
# command line share, and the program acsetup. UI-W2a ships the command line only.
[lib]
path = "src/lib.rs"

[[bin]]
name = "acsetup"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
